name: autohub_ui
description: The Registry design language as Flutter widgets. The only package that knows what a colour is.
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  autohub_core:
    path: ../../packages/autohub_core
  flutter:
    sdk: flutter
  intl: ^0.20.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    # Bundled rather than fetched. A font that arrives over the network is a font that has not
    # arrived when an inspector opens a checklist in a basement — and until these were added, every
    # `fontFamily` in the design system silently fell back to the platform default, which meant the
    # Registry typography existed on the web and nowhere else.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
