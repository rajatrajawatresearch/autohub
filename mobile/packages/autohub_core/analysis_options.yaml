# The workspace's rules, not the scaffold's.
#
# The analyzer resolves the *nearest* options file walking up from each source, so a scaffold file
# sitting here silently shadows `mobile/analysis_options.yaml` for every line in this package — and
# this is the package that can least afford it. `discarded_futures` is not in `flutter_lints` at
# all, `unawaited_futures` is only a lint there, and `strict-casts` is off: precisely the three
# rules standing between a registry decode and a runtime cast error on a handset that cannot be
# hot-fixed. An unawaited future in here is a queued write that never drained.
include: ../../analysis_options.yaml
