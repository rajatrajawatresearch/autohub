include: package:flutter_lints/flutter.yaml

# The Dart half of the same bargain the backend makes with TreatWarningsAsErrors: a warning left to
# rot is how a null registry lookup reaches a handset that cannot be hot-fixed.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Promoted to errors — each one is a real defect class in this codebase, not style.
    invalid_annotation_target: ignore
    todo: ignore

    # A future that nobody awaits is a write that silently did not happen. On a phone, with an
    # offline queue, that is a listing the seller believes they submitted.
    unawaited_futures: error
    discarded_futures: error

    # Dead code and unused elements mean a screen was rewired and something was left behind.
    dead_code: error
    unused_import: error
    unused_local_variable: error
    unused_element: error

    # Exhaustive switches over the closed contract enums. When the contract adds a workflow state
    # category, this is what makes the compiler point at every place that has to decide about it.
    non_exhaustive_switch_expression: error

  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/generated_plugin_registrant.dart'

linter:
  rules:
    # ── Correctness ───────────────────────────────────────────────────────────
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true

    # ── The house style, matching the web ─────────────────────────────────────
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    require_trailing_commas: true
    directives_ordering: true
    sort_pub_dependencies: true

    # ── Public API hygiene ────────────────────────────────────────────────────
    # A package that leaks a private type through a public signature cannot be consumed.
    library_private_types_in_public_api: true
    public_member_api_docs: false

    # ── Deliberately off ──────────────────────────────────────────────────────
    # This product has no `const` colours-as-magic-numbers problem to solve; the tokens already
    # centralise them, and the rule fires constantly on legitimate ThemeExtension work.
    prefer_relative_imports: false
