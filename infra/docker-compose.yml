name: autohub

services:
  postgres:
    image: postgres:16-alpine
    container_name: autohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autohub
      POSTGRES_PASSWORD: autohub_dev
      POSTGRES_DB: autohub
      # uuid v7 + trigram search need these available at init
      POSTGRES_INITDB_ARGS: '--data-checksums'
    ports:
      - '5433:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autohub -d autohub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autohub-redis
    restart: unless-stopped
    # appendonly matters: the auction bid state lives here between writes
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6380:6379'
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────────────
  # Everything below is behind the `full` profile: `docker compose --profile full up -d`.
  # Postgres + Redis alone are enough to run the API and the entire registry spine.
  # Search, object storage, mail and tracing are additive — keep the default `up` fast
  # and keep a laptop with 8GB of RAM usable.
  # ─────────────────────────────────────────────────────────────────────────────

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: autohub-opensearch
    profiles: ['full', 'search']
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - '9201:9200'
    volumes:
      - ./.data/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: autohub-minio
    profiles: ['full', 'storage']
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: autohub
      MINIO_ROOT_PASSWORD: autohub_dev_secret
    ports:
      - '9010:9000'
      - '9011:9001'
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: autohub-mailpit
    profiles: ['full']
    restart: unless-stopped
    ports:
      - '1026:1025'
      - '8026:8025'

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: autohub-jaeger
    profiles: ['full', 'observability']
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16687:16686'
      - '4327:4317'
      - '4328:4318'
